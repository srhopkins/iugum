{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} - iugum beadview</title>
<style>
:root{color-scheme:light dark;--bg:#0f1115;--panel:#161a20;--border:#2a2f38;--text:#e6e8eb;--muted:#8b93a1;--accent:#5aa9e6;--open:#8b93a1;--progress:#5aa9e6;--blocked:#e0666b;--deferred:#6ec7c0;--closed:#5cb87a;}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:1rem;padding:.75rem 1.25rem;border-bottom:1px solid var(--border);background:var(--panel)}
header h1{font-size:1rem;margin:0;font-weight:600}
header nav a{color:var(--muted);text-decoration:none;margin-right:1rem;font-size:.9rem}
header nav a.active,header nav a:hover{color:var(--text)}
header .dir{margin-left:auto;color:var(--muted);font-size:.8rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
main{padding:1.25rem}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:.4rem .6rem;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em}
tr:hover td{background:rgba(255,255,255,.03)}
a{color:var(--accent)}
.pill{display:inline-block;padding:.1rem .5rem;border-radius:1rem;font-size:.72rem;font-weight:600;border:1px solid var(--border)}
.status-open{color:var(--open)}
.status-in_progress{color:var(--progress)}
.status-blocked{color:var(--blocked)}
.status-deferred{color:var(--deferred)}
.status-closed{color:var(--closed)}
.filters{display:flex;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.filters input,.filters select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:.35rem;padding:.35rem .5rem;font-size:.85rem}
.filters input[type=search]{min-width:16rem}
.muted{color:var(--muted)}
.stat{color:var(--muted);font-size:.8rem;margin-bottom:.75rem}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem 1.5rem;margin-bottom:1.25rem;max-width:44rem}
.detail-grid dt{color:var(--muted);font-size:.75rem;text-transform:uppercase}
.detail-grid dd{margin:0 0 .5rem}
pre.body{white-space:pre-wrap;word-wrap:break-word;background:var(--panel);border:1px solid var(--border);border-radius:.5rem;padding:1rem;max-width:56rem;font-family:inherit}
.deps li{margin-bottom:.25rem}
.comment{border-left:2px solid var(--border);padding:.4rem .8rem;margin-bottom:.6rem}
.comment .meta{color:var(--muted);font-size:.75rem;margin-bottom:.2rem}
.error{color:var(--blocked);padding:1rem;border:1px solid var(--blocked);border-radius:.5rem;max-width:40rem}
footer{padding:1rem 1.25rem;color:var(--muted);font-size:.75rem;border-top:1px solid var(--border)}
</style>
</head>
<body>
<header>
<h1>iugum beadview</h1>
<nav>
<a href="/" class="{{if eq .Active "list"}}active{{end}}">Tickets</a>
<a href="/graph" class="{{if eq .Active "graph"}}active{{end}}">Dependency graph</a>
</nav>
<span class="dir">{{.Dir}}</span>
</header>
<main>
{{.Body}}
</main>
<footer>iugum beadview - read-mostly viewer for the beads work graph. No external bd binary. Data: {{.Dir}}</footer>
</body>
</html>
{{end}}

# Copy to ./iugum.yaml or ~/.config/iugum/config.yaml
# Or set IUGUM_CONFIG to an absolute path.

actor: "" # empty = $IUGUM_ACTOR or OS user

# Built-in names: beads, silverbullet, memory, sqlite
# External process that upholds the same contract: exec
# observe: memory keeps the in-process store. observe: sqlite is observe.db.
# iugum observe always uses sqlite even when this field is memory.
tracker: beads
wiki: silverbullet
observe: memory
memory: sqlite
data_dir: "" # empty = IUGUM_DATA or OS data dir

# Optional vectors. Off = FTS5 + substring. Kind ollama uses nomic-embed-text.
embeddings:
  enabled: false
  vec: false # true = sqlite-vec vec0 KNN (needs enabled + embedder). Built on linux/darwin/BSD/windows (vec.go). Other OS: vec_stub.go, cosine in Go.
  kind: off
  url: ""
  model: ""

# Closed relation list. Add or remove a word. extractor: rules | llm | off
graph:
  glossary: glossaries/memory-graph.yaml
  extractor: rules
  # Optional chat extract when extractor is llm. Same glossary gate as rules.
  # llm:
  #   kind: ollama
  #   url: http://127.0.0.1:11434/api/chat
  #   model: qwen3.5:4b

# Jobs: cron spec, @every 1h, or @triggered (adhoc / hook).
# workflow is a linear step list. Not a DAG.
# Optional DAG: after runs when named jobs finish (go-cron OnSuccess, etc.).
jobs:
  - name: ingest-wiki
    spec: "@triggered"
    workflow: [mem.ingest]

  # Step B runs only after step A succeeds (@triggered + after, not workflow).
  # - name: step-a
  #   kind: exec
  #   spec: "@triggered"
  #   command: [echo, step-a-done]
  # - name: step-b
  #   kind: exec
  #   spec: "@triggered"
  #   after: [step-a]
  #   on: success
  #   command: [echo, step-b-done]

  # kind exec runs a local command when the job fires (cron or hook).
  # - name: backup-notes
  #   kind: exec
  #   spec: "@every 24h"
  #   command: [echo, backup-complete]

  # kind session injects text into the standing OpenCode session (ACP).
  # Agents add these with: iugum job add hourly-checks --every 1h --prompt "Run hourly-checks"
  # timeout (hard ceiling, default 4h) and idle_timeout (max silence, default
  # 10m) are optional Go duration strings; a stall watchdog kills the whole
  # process group and logs which one fired.
  # - name: hourly-checks
  #   kind: session
  #   spec: "@every 1h"
  #   prompt: "Run the hourly-checks skill now."
  #   timeout: 4h
  #   idle_timeout: 10m

  # kind http POSTs the event JSON to a URL when the job fires.
  # - name: notify-slack
  #   kind: http
  #   spec: "@triggered"
  #   url: https://example.com/hooks/notify

hooks:
  - on: watch.changed
    job: ingest-wiki

watch:
  - path: ./wiki

# Empty = do not bind. Set an addr to listen for POST /hooks/{name}.
# HMAC-SHA256 uses IUGUM_HOOK_SECRET (GitHub X-Hub-Signature-256).
hook_http: ""

# Casbin (policy engine). Empty paths = embedded allow-all.
# Point these at files when you want real deny rules.
policy:
  model: ""
  policy: ""

# Used only when a slot above is "exec".
# Tracker exec: same CLI as bd.
# Wiki exec: same flags as SilverBullet (-p PORT -L HOST SPACE).
# Observe exec: verb on argv, JSON on stdin, JSON on stdout
#   (ingest-metrics | query-metrics | ingest-logs | search-logs).
exec:
  tracker: []
  wiki: []
  observe: []

# iugum up: one process runs wiki, observe, jobs/hooks/watch, and code-server.
# iugum up --container runs the same inside the iugum image with docker or podman.
container:
  engine: auto # docker | podman | auto (first found on PATH)
  image: iugum:latest
  name: iugum
  mounts: [] # extra -v HOST:CTR. The workspace and data dir mount always.
  ports: [] # -p HOST:CTR. Empty = 3000:3000, 3848:3848, 8080:8080
  env: [] # extra -e KEY=VALUE
  code_server: true # false = do not start code-server on the host or in the image
# Network policy (iugum net plan | apply | show). Absent block = off.
# backend: auto | iptables | nftables | off. auto = nftables when nft is on PATH, else iptables.
# default: chain policy per direction when no rule matches (allow | deny).
# rules: dir in|out, proto tcp|udp|icmp|all, port (tcp/udp), src/dst IP or CIDR, action allow|deny.
# apply needs linux + CAP_NET_ADMIN. plan and apply --dry-run only print.
network:
  backend: off
  default:
    in: deny
    out: allow
  rules:
    - name: wiki-in
      dir: in
      proto: tcp
      port: 3000
      src: 203.0.113.0/24
      action: allow
    - name: observe-in
      dir: in
      proto: tcp
      port: 3848
      action: allow
    - name: no-smtp-out
      dir: out
      proto: tcp
      port: 25
      action: deny

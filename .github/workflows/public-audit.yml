name: public-audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          ver=8.24.0
          tool_dir="$(mktemp -d)"
          trap 'rm -rf "$tool_dir"' EXIT
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" | tar -xz -C "$tool_dir" gitleaks
          sudo install -m 0755 "$tool_dir/gitleaks" /usr/local/bin/gitleaks
      - name: Scan tree
        run: gitleaks dir --no-banner --redact --config .gitleaks.toml --verbose

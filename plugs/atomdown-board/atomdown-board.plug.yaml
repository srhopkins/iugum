# Logical manifest for the atomdown-board plug.
#
# This file is NOT read by SilverBullet at runtime and is NOT compiled by
# `deno task build` / `silverbullet plug-compile` on this machine (see
# README.md for why). It documents the manifest that is hand-encoded inside
# atomdown-board.plug.js, so the two stay in sync when either changes.
name: atomdown-board
version: 0.1
functions:
  toggleBoard:
    path: "./atomdown-board.js:toggleBoard"
    command:
      name: "Atomdown: Toggle Board"

  # Reopens the board after a page load, but only on a page it was left open
  # on. The remembered flag lives in clientStore, keyed by page name - it is
  # presentation state and never touches the document.
  restoreBoard:
    path: "./atomdown-board.js:restoreBoard"
    events:
      - "editor:pageLoaded"
      - "editor:pageReloaded"

  notifyClosed:
    path: "./atomdown-board.js:notifyClosed"

  saveAttrs:
    path: "./atomdown-board.js:saveAttrs"

  reorderAtom:
    path: "./atomdown-board.js:reorderAtom"

  groupAtoms:
    path: "./atomdown-board.js:groupAtoms"

  ungroupAtoms:
    path: "./atomdown-board.js:ungroupAtoms"

  # Rewrites one atom-group's opening marker to change its readable name
  # (its slug). The group's id never changes - a slug is not identity.
  setGroupSlug:
    path: "./atomdown-board.js:setGroupSlug"
